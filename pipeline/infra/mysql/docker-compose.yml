# DART 중앙 MySQL 서버 (Phase 1: SQLite → MySQL 동기화의 대상 DB)
# 설계: docs/handoff/MYSQL_CENTRALIZATION_PLAN.md
#
# 실행:   docker compose up -d        (이 폴더에서)
# 상태:   docker compose ps
# 중지:   docker compose stop
#
# init/ 아래 스크립트는 데이터 볼륨이 비어 있을 때(최초 1회)만 실행된다.
# 스키마를 바꾼 뒤 처음부터 다시 만들려면 `docker compose down -v` (데이터 삭제 주의).

services:
  mysql:
    image: mysql:8.4
    container_name: dart-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      # 처음에는 이 PC에서만 접속 가능하게 묶는다.
      # 팀원 접속을 열 때 "127.0.0.1:" 을 지우고 방화벽/네트워크를 함께 설정한다(README 참고).
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - dart_mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dart_mysql_data:
